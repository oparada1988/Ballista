[package]
name = "ballista"
version = "0.1.0"
edition = "2024"
description = "A fast, modern Elgato Stream Deck companion for Linux"
authors = ["Oscar Parada"]
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
glib = "0.22"
gio = "0.22"
libc = "0.2"
async-channel = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
gdk-pixbuf = "0.22"
cairo-rs = "0.22"
pango = "0.22"
pangocairo = "0.22"
